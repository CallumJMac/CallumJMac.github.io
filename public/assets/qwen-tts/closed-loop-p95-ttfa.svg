<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop concurrency against p95 time to first audio</title>
  <desc id="desc">A line chart with a logarithmic vertical axis in seconds. The 300 millisecond TTFA SLO is marked. Current server p95 values at concurrency 1, 2, 4, 8, 16, and 32 are 0.197465658000067, 4.981369185350093, 14.037079576050019, 29.637841249950053, 54.6511531001503, and 105.16046132319968 seconds. Omni values are 0.173563312749957, 0.284651673449935, 0.62121538660017, 2.127027819200293, 4.849325339399865, and 13.660972452400072 seconds.</desc>
  <metadata>
    {
      "source": "20260716T121717Z-capacity-analysis/capacity-summary.json",
      "metric": "metrics.ttfa_seconds.p95",
      "profile": "closed",
      "units": "seconds",
      "scale": "log10",
      "current": [[1,0.197465658000067],[2,4.981369185350093],[4,14.037079576050019],[8,29.637841249950053],[16,54.6511531001503],[32,105.16046132319968]],
      "omni": [[1,0.173563312749957],[2,0.284651673449935],[4,0.62121538660017],[8,2.127027819200293],[16,4.849325339399865],[32,13.660972452400072]],
      "ttfa_slo_seconds": 0.3
    }
  </metadata>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #f8fafc;
      --ink: #172033;
      --muted: #536176;
      --grid: #cbd3df;
      --current: #2563eb;
      --omni: #0b7a63;
      --slo: #b45309;
      --slo-soft: #fff1cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #101722;
        --ink: #eef3fa;
        --muted: #b6c1d1;
        --grid: #46566d;
        --current: #79a7ff;
        --omni: #63dfbd;
        --slo: #ffc66d;
        --slo-soft: #523a18;
      }
    }
    text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #172033;
      fill: var(--ink);
    }
    .surface { fill: #f8fafc; fill: var(--surface); }
    .heading { font-size: 23px; font-weight: 720; }
    .axis-label { font-size: 15px; font-weight: 650; }
    .tick { font-size: 13px; fill: #536176; fill: var(--muted); }
    .grid { stroke: #cbd3df; stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: #172033; stroke: var(--ink); stroke-width: 1.5; }
    .current-line { fill: none; stroke: #2563eb; stroke: var(--current); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .omni-line { fill: none; stroke: #0b7a63; stroke: var(--omni); stroke-width: 3; stroke-dasharray: 8 5; stroke-linejoin: round; stroke-linecap: round; }
    .current-point { fill: #f8fafc; fill: var(--surface); stroke: #2563eb; stroke: var(--current); stroke-width: 3; }
    .omni-point { fill: #f8fafc; fill: var(--surface); stroke: #0b7a63; stroke: var(--omni); stroke-width: 3; }
    .slo { stroke: #b45309; stroke: var(--slo); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .slo-box { fill: #fff1cc; fill: var(--slo-soft); }
    .slo-label { fill: #b45309; fill: var(--slo); }
    .legend { font-size: 14px; font-weight: 650; }
  </style>


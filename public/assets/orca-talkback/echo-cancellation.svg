<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
  <title id="title">Microphone level before and after echo cancellation</title>
  <desc id="desc">While orca-talkback speaks a four-sentence reply through MacBook speakers, the microphone hears its voice at around minus 33 dBFS. After WebRTC echo cancellation the same signal sits around minus 66 dBFS, a median of 26 dB quieter, so voice detection only reacts to a voice it did not play.</desc>

  <style>
    :root {
      color-scheme: light dark;
      --surface: #f8fafc; --panel: #ffffff; --ink: #172033; --muted: #536176; --line: #9aa7b8; --grid: #e2e8f0;
      --blue: #2563eb; --blue-soft: #dbeafe; --amber: #a35b00; --amber-soft: #fff1cc; --green: #08745b; --green-soft: #d8f3e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #101722; --panel: #182231; --ink: #eef3fa; --muted: #b6c1d1; --line: #718096; --grid: #263244;
        --blue: #5b8ef0; --blue-soft: #203b68; --amber: #c98320; --amber-soft: #523a18; --green: #6ee7c2; --green-soft: #16483c;
      }
    }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; fill: var(--ink); }
    .surface { fill: var(--surface); }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .panel-blue { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; }
    .panel-amber { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.5; }
    .panel-green { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.5; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: var(--muted); }
    .tiny { font-size: 12px; fill: var(--muted); }
    .arrow { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-blue { stroke: var(--blue); stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); }
    .arrow-amber { stroke: var(--amber); stroke-width: 2; fill: none; marker-end: url(#arrowhead-amber); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--line); stroke-width: 1; }
    .series-amber { stroke: var(--amber); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .series-blue { stroke: var(--blue); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .fill-blue { fill: var(--blue); }
    .fill-amber { fill: var(--amber); }
    .fill-muted { fill: var(--line); }
    .label-amber { fill: var(--amber); font-size: 14px; font-weight: 600; }
    .label-blue { fill: var(--blue); font-size: 14px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
    <marker id="arrowhead-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowhead-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35b00"/></marker>
  </defs>
  <rect class="surface" x="0" y="0" width="840" height="470" rx="18"/>
  <text class="title" x="40" y="48">Its own voice, before and after echo cancellation</text>
  <text class="small" x="40" y="72">Microphone level while orca-talkback speaks a four-sentence reply through MacBook speakers</text>
  <line class="series-amber" x1="560" y1="44" x2="584" y2="44"/><text class="tiny" x="590" y="48">Microphone</text>
  <line class="series-blue" x1="672" y1="44" x2="696" y2="44"/><text class="tiny" x="702" y="48">After cancellation</text>
  <line class="grid" x1="80" y1="368.57142857142856" x2="720" y2="368.57142857142856"/>
  <text class="tiny" x="70" y="372.57142857142856" text-anchor="end">-80 dB</text>
  <line class="grid" x1="80" y1="325.7142857142857" x2="720" y2="325.7142857142857"/>
  <text class="tiny" x="70" y="329.7142857142857" text-anchor="end">-70 dB</text>
  <line class="grid" x1="80" y1="282.8571428571429" x2="720" y2="282.8571428571429"/>
  <text class="tiny" x="70" y="286.8571428571429" text-anchor="end">-60 dB</text>
  <line class="grid" x1="80" y1="240.0" x2="720" y2="240.0"/>
  <text class="tiny" x="70" y="244.0" text-anchor="end">-50 dB</text>
  <line class="grid" x1="80" y1="197.14285714285714" x2="720" y2="197.14285714285714"/>
  <text class="tiny" x="70" y="201.14285714285714" text-anchor="end">-40 dB</text>
  <line class="grid" x1="80" y1="154.28571428571428" x2="720" y2="154.28571428571428"/>
  <text class="tiny" x="70" y="158.28571428571428" text-anchor="end">-30 dB</text>
  <line class="grid" x1="80" y1="111.42857142857143" x2="720" y2="111.42857142857143"/>
  <text class="tiny" x="70" y="115.42857142857143" text-anchor="end">-20 dB</text>
  <text class="tiny" x="80.0" y="412" text-anchor="middle">0 s</text>
  <text class="tiny" x="187.56302521008402" y="412" text-anchor="middle">2 s</text>
  <text class="tiny" x="295.12605042016804" y="412" text-anchor="middle">4 s</text>
  <text class="tiny" x="402.6890756302521" y="412" text-anchor="middle">6 s</text>
  <text class="tiny" x="510.2521008403361" y="412" text-anchor="middle">8 s</text>
  <text class="tiny" x="617.8151260504202" y="412" text-anchor="middle">10 s</text>
  <line class="axis" x1="80" y1="390" x2="720" y2="390"/>
  <path class="series-amber" d="M85.4,214.1 L96.1,166.8 L106.9,173.1 L117.6,174.8 L128.4,162.1 L139.2,170.9 L149.9,195.4 L160.7,159.5 L171.4,196.0 L182.2,191.8 L192.9,185.4 L203.7,148.8 L214.5,168.5 L225.2,197.5 L236.0,196.3 L246.7,175.4 L257.5,181.8 L268.2,195.8 L279.0,166.3 L289.7,193.4 L300.5,206.1 L311.3,198.8 L322.0,231.3 L332.8,225.0 L343.5,180.8 L354.3,167.6 L365.0,184.3 L375.8,217.6 L386.6,181.8 L397.3,176.5 L408.1,169.9 L418.8,170.4 L429.6,201.6 L440.3,194.1 L451.1,195.4 L461.8,190.7 L472.6,244.3 L483.4,228.8 L494.1,192.5 L504.9,189.5 L515.6,177.8 L526.4,198.2 L537.1,163.8 L547.9,172.6 L558.7,181.3 L569.4,225.9 L580.2,204.1 L590.9,178.8 L601.7,184.2 L612.4,174.6 L623.2,222.5 L633.9,183.6 L644.7,165.0 L655.5,165.3 L666.2,157.0 L677.0,174.6 L687.7,180.3 L698.5,180.8 L709.2,191.8 L720.0,182.9"/>
  <path class="series-blue" d="M85.4,339.3 L96.1,341.1 L106.9,338.7 L117.6,288.7 L128.4,192.8 L139.2,231.3 L149.9,280.1 L160.7,224.0 L171.4,273.5 L182.2,249.8 L192.9,243.3 L203.7,264.7 L214.5,317.3 L225.2,292.6 L236.0,317.3 L246.7,271.5 L257.5,304.4 L268.2,309.3 L279.0,284.3 L289.7,286.3 L300.5,311.3 L311.3,311.8 L322.0,317.0 L332.8,305.0 L343.5,326.2 L354.3,324.0 L365.0,324.1 L375.8,316.3 L386.6,325.4 L397.3,322.6 L408.1,321.8 L418.8,325.4 L429.6,328.2 L440.3,331.0 L451.1,328.2 L461.8,320.0 L472.6,328.2 L483.4,292.4 L494.1,315.2 L504.9,325.8 L515.6,327.0 L526.4,320.9 L537.1,293.5 L547.9,199.5 L558.7,252.6 L569.4,306.3 L580.2,253.6 L590.9,233.2 L601.7,326.8 L612.4,321.7 L623.2,322.3 L633.9,320.4 L644.7,323.0 L655.5,314.3 L666.2,203.6 L677.0,218.1 L687.7,269.9 L698.5,223.3 L709.2,278.9 L720.0,295.7"/>
  <text class="label-amber" x="730" y="167.14285714285714">Microphone</text>
  <text class="tiny" x="730" y="183.14285714285714">its own voice</text>
  <text class="label-blue" x="730" y="308.57142857142856">After echo</text>
  <text class="label-blue" x="730" y="324.57142857142856">cancellation</text>
  <text class="label" x="400.0" y="442" text-anchor="middle">Median 26 dB quieter, so only your voice is loud enough to stop it</text>
</svg>
